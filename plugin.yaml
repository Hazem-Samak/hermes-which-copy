name: which-copy
label: Which Copy
version: 1.2.1
manifest_version: 2
author: Hazem Samak
license: MIT
homepage: https://github.com/Hazem-Samak/hermes-which-copy
description: >-
  Answers the question that silently decides everything else: which copy of a
  command is the Hermes process actually going to run? On a Mac the same tool can
  exist three times over — a Homebrew formula, an npm global install, a pyenv or
  uv shim, a standalone download, and Hermes's own bundled copy — and the name
  resolves to whichever one PATH reaches first, with no warning when that is the
  wrong one. which-copy resolves the name against the PATH of the running Hermes
  process (the environment it was started with) and against the PATH your own
  login shell builds for a terminal, reports both when they disagree, and states
  plainly that Hermes's terminal tool runs commands in a login shell whose PATH
  also gains directories Hermes adds — so it never claims the two are the same
  PATH. It lists every copy
  it can find with where it came from (Cellar, npm tree, pyenv, uv, pipx, nvm,
  Hermes's directory, a plain folder, the macOS system), the version each one
  reports, and whether it can even run on this machine (an Intel-only binary on
  Apple silicon is named as such). Then it gives a verdict in plain language:
  healthy, an old copy shadowing a newer one, a dead symlink sitting in front of
  the winner, Hermes's process PATH preferring its own bundle, or your terminal
  and Hermes disagreeing. One tool checks a single name, one sweeps the whole
  environment for the usual AI tools. It diagnoses and never repairs: it does not
  edit PATH, install, uninstall, relink or move anything, makes no network call,
  needs no API key, and writes no files. The only thing it executes is a bounded,
  shell-free version probe of a copy that Hermes's own PATH, your login shell's
  PATH or a known install directory put on this machine (argv only, cwd=/,
  stripped environment) that never sees your credentials. Nothing named in a tool
  call is ever run: a file passed as a path, a copy found only in a PATH string
  the call supplies, and a copy behind a relative or empty PATH entry are all
  described with their version left unchecked, so a prompt-injected repository
  cannot get its own script executed. For a call that supplies `path`, every
  version probe runs with Hermes's own process PATH, never the raw supplied
  string. probe_versions false skips probing altogether.
  When something is wrong it says what and why, and leaves the fixing to you.
requires_hermes: ">=0.22.0"
tags: [diagnostics, path, environment, cli, macos, local, privacy, tools]
provides_tools:
  - which_copy
  - which_copy_scan
provides_hooks: []
python_dependencies: []
